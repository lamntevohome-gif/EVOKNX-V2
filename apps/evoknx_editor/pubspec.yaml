name: evoknx_editor
description: EVOKNX Editor - thiết kế giao diện điều khiển KNX cho Windows.
publish_to: none
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  knx_core:
    path: ../../packages/knx_core
  knx_config:
    path: ../../packages/knx_config
  file_selector: ^1.0.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
